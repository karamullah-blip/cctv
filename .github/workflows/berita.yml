name: Perbarui pita berita

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: berita
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/berita.py news.json
        continue-on-error: true
      - name: Kondisi ruas (TomTom)
        run: python3 scripts/ruas.py ruas.json || (echo "Google gagal, coba TomTom"; GOOGLE_ROUTES_KEY= python3 scripts/ruas.py ruas.json)
        continue-on-error: true
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY || secrets.APIKEY }}
          GOOGLE_ROUTES_KEY: ${{ secrets.GOOGLE_ROUTES_KEY || secrets.APIKEYCCTV }}
      - name: Titik api NASA FIRMS (Sumsel)
        run: python3 scripts/titik_api.py hotspot.json
        continue-on-error: true
      - name: Curah hujan SITAJIR Palembang
        run: python3 scripts/curah_hujan.py hujan.json
        continue-on-error: true
      - name: Commit jika berubah
        run: |
          git add news.json
          [ -f ruas.json ] && git add ruas.json
          [ -f hotspot.json ] && git add hotspot.json
          [ -f hujan.json ] && git add hujan.json
          if git diff --cached --quiet; then echo "tidak ada perubahan"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Perbarui news.json / ruas.json / hotspot.json"
          git pull --rebase origin main
          git push
